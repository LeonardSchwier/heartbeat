name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Validate example configs parse
        run: |
          python -c "
          import yaml
          with open('checks.example.yml') as f:
              data = yaml.safe_load(f)
          assert 'http_checks' in data
          assert 'mx_checks' in data
          print('checks.example.yml is valid YAML')
          "
